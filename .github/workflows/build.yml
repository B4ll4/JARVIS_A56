name: Build JARVIS A56 APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Calculate SHA256
      run: |
        SHA256=$(sha256sum app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')
        echo "APK_SHA256=$SHA256" >> $GITHUB_ENV
        echo "SHA256: $SHA256"

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v3
      with:
        name: jarvis-a56-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v1.0.0-${{ github.run_number }}
        release_name: JARVIS A56 v1.0.0 Build ${{ github.run_number }}
        body: |
          **JARVIS A56 - APK Debug Build**
          
          Package: com.jarvis.a56
          Target SDK: 34
          Min SDK: 34
          
          **SHA256:** ${{ env.APK_SHA256 }}
          
          **Features:**
          - Reator Arc Interface
          - Shizuku Integration
          - Device Admin Control
          - System Commands
          
          **Installation:**
          ```bash
          adb install app-debug.apk
          ```
        draft: false
        prerelease: false

    - name: Upload APK to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./app/build/outputs/apk/debug/app-debug.apk
        asset_name: jarvis-a56-debug.apk
        asset_content_type: application/vnd.android.package-archive
