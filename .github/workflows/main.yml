name: JARVIS APOCALIPSE FINAL
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - uses: android-actions/setup-android@v3
      
      - name: Forçar Gradle 8.9 ESTÁVEL
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
          
      - name: EXTERMINAR TODAS AS BOMBAS DO MANUS DE UMA VEZ
        run: |
          # 1. Gradle.properties limpo sem MaxPermSize
          rm -f gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties
          
          # 2. MATA TODOS OS REPOS MORTOS E LIBS ALPHA/BETA
          find . -name "*.gradle*" -type f -exec sed -i '/maven.rikka.app/d' {} +
          find . -name "*.gradle*" -type f -exec sed -i '/androidx.*:.*-alpha.*/d' {} +
          find . -name "*.gradle*" -type f -exec sed -i '/androidx.*:.*:.*-beta.*/d' {} +
          find . -name "*.gradle*" -type f -exec sed -i '/androidx.*:.*:.*-rc.*/d' {} +
          find . -name "*.gradle*" -type f -exec sed -i '/speechrecognition/d' {} +
          find . -name "*.gradle*" -type f -exec sed -i '/health-data-client/d' {} +
          find . -name "*.gradle*" -type f -exec sed -i '/health-connect/d' {} +
          find . -name "*.gradle*" -type f -exec sed -i '/wearable/d' {} +
          
          # 3. FORÇA SDK 34 E AGP 8.1.4 ESTÁVEL EM TUDO
          find . -name "*.gradle*" -type f -exec sed -i 's/compileSdk = 36/compileSdk = 34/g' {} +
          find . -name "*.gradle*" -type f -exec sed -i 's/targetSdk = 36/targetSdk = 34/g' {} +
          find . -name "*.gradle*" -type f -exec sed -i 's/compileSdkVersion 36/compileSdkVersion 34/g' {} +
          find . -name "*.gradle*" -type f -exec sed -i 's/targetSdkVersion 36/targetSdkVersion 34/g' {} +
          find . -name "*.gradle*" -type f -exec sed -i 's/id("com.android.application") version "8.2.0"/id("com.android.application") version "8.1.4"/g' {} +
          find . -name "*.gradle*" -type f -exec sed -i 's/id "com.android.application" version "8.2.0"/id "com.android.application" version "8.1.4"/g' {} +
          
          # 4. SHIZUKU 13.1.5 DO MAVEN CENTRAL - ÚNICA LIB QUE IMPORTA
          find . -name "*.gradle*" -type f -exec sed -i 's/implementation("dev.rikka.shizuku:api:.*")/implementation("dev.rikka.shizuku:api:13.1.5")/g' {} +
          find . -name "*.gradle*" -type f -exec sed -i 's/implementation("dev.rikka.shizuku:provider:.*")/implementation("dev.rikka.shizuku:provider:13.1.5")/g' {} +
          find . -name "*.gradle*" -type f -exec sed -i 's/implementation "dev.rikka.shizuku:api:.*"/implementation "dev.rikka.shizuku:api:13.1.5"/g' {} +
          find . -name "*.gradle*" -type f -exec sed -i 's/implementation "dev.rikka.shizuku:provider:.*"/implementation "dev.rikka.shizuku:provider:13.1.5"/g' {} +
          
      - name: Build Final
        run: gradle clean assembleDebug --no-daemon --stacktrace
        
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-A56-AGORA-VAI-PORRA
          path: app/build/outputs/apk/debug/*.apk
