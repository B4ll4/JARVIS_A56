name: JARVIS - THE REAL FINAL
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - uses: android-actions/setup-android@v3
      
      - name: Forçar Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
          
      - name: RECONSTRUIR O PROJETO DO ZERO
        run: |
          # 1. Gradle.properties limpo
          rm -f gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties
          
          # 2. RECRIA settings.gradle.kts DO ZERO COM REPOS CERTOS
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JARVIS-A56"
          include(":app")
          EOF
          
          # 3. MATA TODAS AS LIBS ALPHA/BETA/RC E REPO MORTO
          find . -name "build.gradle*" -type f -exec sed -i '/maven.rikka.app/d' {} +
          find . -name "build.gradle*" -type f -exec sed -i '/androidx.*:.*-alpha.*/d' {} +
          find . -name "build.gradle*" -type f -exec sed -i '/androidx.*:.*:.*-beta.*/d' {} +
          find . -name "build.gradle*" -type f -exec sed -i '/androidx.*:.*:.*-rc.*/d' {} +
          
          # 4. FORÇA VERSÕES ESTÁVEIS EM TUDO
          find . -name "build.gradle*" -type f -exec sed -i 's/compileSdk = 36/compileSdk = 34/g' {} +
          find . -name "build.gradle*" -type f -exec sed -i 's/targetSdk = 36/targetSdk = 34/g' {} +
          find . -name "build.gradle*" -type f -exec sed -i 's/compileSdkVersion 36/compileSdkVersion 34/g' {} +
          find . -name "build.gradle*" -type f -exec sed -i 's/targetSdkVersion 36/targetSdkVersion 34/g' {} +
          find . -name "build.gradle*" -type f -exec sed -i 's/id("com.android.application") version "8.2.0"/id("com.android.application") version "8.1.4"/g' {} +
          find . -name "build.gradle*" -type f -exec sed -i 's/id "com.android.application" version "8.2.0"/id "com.android.application" version "8.1.4"/g' {} +
          
          # 5. SHIZUKU 13.1.5 ESTÁVEL
          find . -name "build.gradle*" -type f -exec sed -i 's/implementation("dev.rikka.shizuku:api:.*")/implementation("dev.rikka.shizuku:api:13.1.5")/g' {} +
          find . -name "build.gradle*" -type f -exec sed -i 's/implementation("dev.rikka.shizuku:provider:.*")/implementation("dev.rikka.shizuku:provider:13.1.5")/g' {} +
          
      - name: Build
        run: gradle clean assembleDebug --no-daemon --stacktrace
        
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-A56-REAL-FINAL
          path: app/build/outputs/apk/debug/*.apk
