name: Build APK - DEFINITIVO
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - uses: android-actions/setup-android@v3
      
      - name: Limpar configs cagadas do projeto
        run: |
          find . -name "gradle.properties" -delete
          find . -name "gradle-wrapper.properties" -exec sed -i '/jvmargs/d' {} +
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties
          
      - name: Forçar versões estáveis
        run: |
          sed -i 's/compileSdk = 36/compileSdk = 34/g' app/build.gradle
          sed -i 's/targetSdk = 36/targetSdk = 34/g' app/build.gradle
          sed -i 's/id "com.android.application" version "8.2.0"/id "com.android.application" version "8.1.4"/g' build.gradle
          sed -i 's/compileSdk 36/compileSdk 34/g' app/build.gradle
          sed -i 's/targetSdk 36/targetSdk 34/g' app/build.gradle
          
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
        
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-A56-APK
          path: app/build/outputs/apk/debug/app-debug.apk
